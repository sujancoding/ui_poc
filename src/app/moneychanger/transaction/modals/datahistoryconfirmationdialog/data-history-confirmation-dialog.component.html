<h4 mat-dialog-title>
    <div class="task-header" fxLayoutAlign="space-between center">

        <h4 class="title-label">Confirmation</h4>

        <span
        #tooltip="matTooltip"
        matTooltip="Close"
        matTooltipPosition="above"
        matTooltipClass="accounts-custom-tooltip">
            <mat-icon [mat-dialog-close]="true" class="close-icon">close</mat-icon>
        </span>

    </div>
</h4>

<h5 class="message" > {{message}} </h5>

<div fxLayout="row" fxLayoutGap="10px" class="btn-row">
    <button mat-button class="no-btn" [mat-dialog-close]="true">No</button>
    <button mat-button (click)="confirmToStore()" class="yes-btn">Yes</button>
</div>
