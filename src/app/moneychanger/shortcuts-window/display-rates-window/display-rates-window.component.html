

<div>
  <div class="row" fxLayoutAlign="center" >
  

    <div>
     <h1 class="label"><b>ARCADE PLAZA TRADERS PTE LTD. </b></h1>  
     </div>

     <div class="refresh-btn-layout">
        <mat-icon class="refresh-btn"  #tooltip="matTooltip"
        matTooltip="Refresh"
        matTooltipPosition="above"
        matTooltipClass="custom-tooltip"(click)="reloadRates()">refresh</mat-icon>
      </div>
    

</div>
  </div>

  <div fxLayout="row" style="margin-left: 10px;height: 18px;
  align-items: center;justify-content: center;" fxLayoutGap="20px"> 

   <h5 class="time-label">Date: </h5>  <h5 class="value"> {{myDate | date : 'mediumDate'}}</h5> 
  <h5 class="time-label">Time: </h5>  <h5 class="value"> {{time}}</h5> 
 
 </div>


  
  
  <!--Table-->
 
    <div class="table-wrapper">
      <div class="mat-elevation-z8">
        <div>
          <table class="table">
  
            <thead>
              <th style="color: rgb(255, 255, 255);">CURRENCY CODE</th>
              <th style="color: rgb(255, 255, 255);">BUY RATE</th>
              <th style="color: rgb(255, 255, 255);">SELL RATE</th>
            </thead>
  
            <tbody>
              <tr *ngFor="let list of displayedRecords ; let i = index" class="currency-code" 
             >
  
                <td [class.blink-row]="list.TODAYSOFFER == 'true'"  >
                  <div fxLayout="row" fxLayoutGap="5px" style="justify-content: center;">
                    <span style="font-size: x-large;" class="{{list.FLAG}}"></span>
  
                    <label> {{list.CCYCODE}} </label>
                  </div>
                </td>
                <td [class.blink-row]="list.TODAYSOFFER == 'true'"  >
                <!-- format value function is used for Comma seprators -->
                  {{ list.BUYRATE == 0 ? 'No stock' : formatValue(list.BUYRATE) }}
                </td>
                <td [class.blink-row]="list.TODAYSOFFER == 'true'"  >
                <!-- format value function is used for Comma seprators -->
                  {{ list.SELLRATE == 0 ? 'No stock' : formatValue(list.SELLRATE) }}
                </td>
              
  
             
              </tr>
  
            </tbody>
  
          </table>
        </div>
      </div>
      <!--Loader-->
      <div *ngIf="loader" class="loader-wrapper">
        <mat-spinner> </mat-spinner>
      </div>
    </div>

    <div fxLayout="row" fxLayoutAlign="space-between">

      <div>
        <img class="payNow-logo" [src]="payNowImage">
    </div>
    
      <div class="whole-card">
        <mat-card appearance="outlined" class="example-card">
          <mat-card-content class="card-content">
           ** {{notesValue}}
          </mat-card-content>
        </mat-card>
  </div>

      
    </div>
