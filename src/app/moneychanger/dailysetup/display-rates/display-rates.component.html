<div class="row" >
 

    <div >
      <button 
                                          matTooltip="Open in new window"
                                          matTooltipPosition="above" matTooltipClass="custom-tooltip"
                                           mat-button class="open-window-btn" (click)="openRatesWindow()">
        <mat-icon class="launch-icon">launch</mat-icon>
      </button>
     </div>
 
  </div>
  
  
  <!--Table-->
 
    <div class="table-wrapper">
      <div class="mat-elevation-z8">
        <div [style.height.px]="changeTableHeight()" [style.overflow-y]="getOverFlow()">
          <table class="table">
  
   <thead>
    <tr>
      <th style="color: rgb(255, 255, 255);">CURRENCY CODE</th>
      <th style="color: rgb(255, 255, 255);">BUY RATE</th>
      <th style="color: rgb(255, 255, 255);">SELL RATE</th>
    </tr>
  </thead>
  
            <tbody>
              <tr *ngFor="let list of currencyRatesArray ; let i = index">
                <td>
                  <div fxLayout="row" fxLayoutGap="30px">
                    <span style="font-size: x-large;" class="{{list.FLAG}}"></span>
  
                    <label> {{list.CCYCODE}} </label>
                  </div>
                </td>
                <td>
                  <!-- format value function is used for Comma seprators -->
                  {{ list.BUYRATE == 0 ? 'No stock' : formatValue(list.BUYRATE) }}
                </td>
                <td>
                  <!-- format value function is used for Comma seprators -->
                  {{ list.SELLRATE == 0 ? 'No stock' : formatValue(list.SELLRATE) }}
                </td>
               
    
              </tr>
  
            </tbody>
  
          </table>
        </div>
      </div>
      <!--Loader-->
      <div *ngIf="loader" class="loader-wrapper">
        <mat-spinner> </mat-spinner>
      </div>
    </div>

    <div>

      <div>
        <mat-card appearance="outlined" class="example-card">
          <h4 class="note-text">Notes</h4>
          <mat-divider style="margin-top: 8px;"></mat-divider>
          <mat-card-content class="card-content">
           {{notesValue}}
          </mat-card-content>
        </mat-card>
      </div>

     

    </div>
