<button [ngStyle]="{'margin-inline-start': textPosition()}" [matMenuTriggerFor]="flags" mat-icon-button class="m-r-3" >
  <i *ngIf="showLanguage" class="flag-icon flag-icon-{{ selectedLanguage.icon }}"> </i>
</button>
<mat-menu #flags="matMenu" class="mymegamenu">
  <button mat-menu-item *ngFor="let lang of languages" (click)="changeLanguage(lang)">
    <i class="flag-icon flag-icon-{{ lang.icon }} m-r-10"></i>
    <span>{{ lang.language }}</span>
  </button>
</mat-menu>

<ng-container *ngIf="showIndividualLinks">
<button [matMenuTriggerFor]="profile" mat-icon-button class="m-r-5">
  <img src="assets/images/users/1.png" alt="user" style="background-color: white;" class="profile-pic" />
</button>

<mat-menu #profile="matMenu" class="mymegamenu">
  <button mat-menu-item (click)="bioInfo()">
    <mat-icon>account_box</mat-icon> Personal Info
  </button>
  <button mat-menu-item (click)="sow()">
    <mat-icon>work</mat-icon> Source of Income
  </button>

  <button mat-menu-item  (click)="documents()">
    <mat-icon>cloud_upload</mat-icon> Identity Document
  </button>

  <button mat-menu-item  (click)="goToDeleteAccount()">
    <mat-icon>delete</mat-icon> Delete Account
  </button>

  <!-- <button mat-menu-item id="languageMenu" (click)="profileMenu($event)">
    <mat-icon>language</mat-icon> Languages
  </button> -->

</mat-menu>

</ng-container>
