<div class="dialog-box">
<mat-toolbar color="primary" class="custom-toolbar">
    <span style="font-size: 18px;">Confirm this action</span>
            <mat-icon style="cursor: pointer;font-size: 22px;" [mat-dialog-close]="true">close</mat-icon>
  </mat-toolbar>
  <div style="margin: 18px;margin-bottom: 28px;">
<div fxLayout="row" fxLayoutAlign="start" style="margin-top: -18px;">
    <mat-icon class="alert-icon">warning</mat-icon>
    <h5 class="alert-label">Are you sure you would <br> like to logout ?</h5>
</div>
<div fxLayout="row" fxLayoutAlign="end" style="margin-right: 20px;">
    <button class="no-button" [mat-dialog-close]="true" mat-flat-button>No</button>
    <button class="yes-button" [mat-dialog-close]="true" (click)="logout()" mat-raised-button color="warn">Yes</button>
</div>
</div>
</div>
