<!-- Mat Dialog - toolbar -->
<h4 mat-dialog-title>
    <mat-toolbar role="toolbar" class="task-header" fxLayoutAlign="space-between center">
      <span> Update Customer Accounts </span>
      <span [mat-dialog-close]="true" style="cursor: pointer;">
        <mat-icon>close</mat-icon>
        </span>
  </mat-toolbar>
</h4>

<div class="content">

<div fxLayout="row" fxLayoutGap="15px" >
    <div fxLayout="row">
        <span class="label">Customer Name :</span>
        <span class="value"> {{customerName}} </span>
    </div>
    |
    <div fxLayout="row">
        <span class="label">Customer Type :</span>
        <span class="value"> {{customerTypeDescription}} </span>
    </div>

</div>


<!--Table-->
<div class="table-wrapper" style="margin-top: 22px !important;">

    <form [formGroup]="form">

    <div class="mat-elevation-z8">
      <div class="scroll-table">
        <table class="table">
  
          <thead>
            <th>ACCOUNT NO</th>
            <th>ACCOUNT NAME</th>
            <th>STATUS</th>
            <th> MARGIN TIER </th>
            <!-- <th> LAST UPDATED BY & TIME </th> -->
            <th>  ACTION </th>
          </thead>
  
          <tbody *ngIf="searchData" formArrayName="rows">
            <tr *ngFor="let search of customerAccountsSearch;let i = index" [formGroupName]="i">
              <td  >
                {{search.ACCOUNTNO}}
              </td>
              <td  >
                 {{search.ACCOUNTNAME}}
                </td>
              <td>
                <mat-checkbox formControlName="status" class="chkbox-margin"></mat-checkbox>
              </td>
              <td>
                <mat-form-field appearance="outline">
                  <mat-select formControlName="marginTier" [disabled]="!search.editMode">
                      <mat-option [disabled]="!search.editMode" *ngFor="let options of marginTierArray" [value]="options.tier"> {{options.tier}}
                      </mat-option>
                  </mat-select>
              </mat-form-field>
              
              </td>

              <!-- <td>
                <div fxLayout="column" fxLayoutGap="5px" class="updated-by-area">
                <div> {{search.UPDATEDBY}} </div>
                <div class="sub-value"> {{search.UPDATEDDATE | date : 'medium' }} </div>
                </div>
               </td> -->

              <td>
                <button mat-button class="edit-icon" 
                #tooltip="matTooltip"
                [matTooltip]=" (customerType == 'I' || search.ACCOUNTNAME == 'MC') ? 'Disabled' : 'Edit' "
                matTooltipPosition="above"
                matTooltipClass="accounts-custom-tooltip"
                [disabled]=" customerType == 'I' || search.ACCOUNTNAME == 'MC' "
                *ngIf="!search.editMode" (click)="onEditAccess(i)"  >
                  <mat-icon>create</mat-icon> 
                </button> 
                
                <button mat-button class="save-icon" 
                #tooltip="matTooltip"
                matTooltip="Update"
                matTooltipPosition="above"
                matTooltipClass="accounts-custom-tooltip"
                *ngIf="search.editMode " (click)="onSaveMarginTier(i)"  >
                  <mat-icon>save</mat-icon> 
                </button> 
              </td>
    
            </tr>
  
          </tbody>

          <tbody *ngIf="noSearchData">
            <tr>
              <td> {{errorMessage}} </td>
            </tr>
          </tbody>
  
        </table>
      </div>
  
  
    </div>

    </form>
  
  
    <!--Loader-->
    <div *ngIf="loader" class="loader-wrapper">
      <mat-spinner> </mat-spinner>
    </div>
  
  </div>


  <div class="margin-button">
    <button type="button"  (click)="updateCustomerAccounts()" class="close-mat-button" mat-button>Save Changes</button>
</div>


  </div>
