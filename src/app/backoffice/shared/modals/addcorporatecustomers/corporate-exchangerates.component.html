<h4 mat-dialog-title>
    <mat-toolbar role="toolbar" class="task-header" fxLayoutAlign="space-between center">
      <span> Add Rates </span>
      <span [mat-dialog-close]="true" style="cursor: pointer;">
        <mat-icon>close</mat-icon>
        </span>
  </mat-toolbar>
    </h4>
<div style="margin: 43px;">

  

<div fxLayout="column" fxLayoutAlign="space-around">
  <div fxflex="13">
    <mat-form-field appearance="outline">
      <mat-label class="custom-label">Customer Name</mat-label>
      <mat-select>
        <mat-option> TEST CORPORATE </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div fxflex="13">
    <mat-form-field  appearance="outline">
      <mat-label class="custom-label">Currency Code</mat-label>
      <mat-select>
        <mat-option> MYR </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div fxflex="13">
    <mat-form-field  appearance="outline">
      <mat-label class="custom-label">Exchange Rate</mat-label>
      <input matInput type="text">
    </mat-form-field>
  </div>
</div>
<div  class="dialogButton" fxLayout="row wrap" fxLayoutAlign="space-around">
    <button mat-raised-button  class="mat-button" [mat-dialog-close]="true"  type="button">Close</button>
     <button mat-raised-button  class="submit-button" [mat-dialog-close]="true"  type="submit">Submit</button>
</div> 



</div>
