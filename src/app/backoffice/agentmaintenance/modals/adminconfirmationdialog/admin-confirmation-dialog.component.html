<div *ngIf="deactivateAgentFlag">
    <h4 class="red">Are you Sure ? Enter reason to Deactivate an Agent</h4>
    <p>
        <mat-form-field>
            <input matInput aria-placeholder="Lorem ipsum dolor sit umlet , consectetur adipiscins clit">
          </mat-form-field>
    </p>
    <div fxLayout="row" fxLayoutAlign="space-between">
    <button  class="white" [mat-dialog-close]="true">Close</button>
    <div *ngIf="showConfirmButton">
    <button mat-raised-button class="color" type="button" (click)="closeDeactivationDialog()" >Confirm</button>
    </div>

    </div>
    </div>

    <div *ngIf="activateAgentFlag">

        <h4>Are you sure ? Enter reason to Activate an Agent</h4>
        <p>
          <mat-form-field>
              <input matInput aria-placeholder="Not suspicion .. ">
            </mat-form-field>
        </p>
        
        <div fxLayout="row" fxLayoutAlign="space-between">
          <button  class="white" [mat-dialog-close]="true">Close</button>
          <div *ngIf="showConfirmButton">
          <button mat-raised-button class="color" type="button" (click)="closeActivationDialog()" >Confirm</button>
          </div>
          </div>
        
        </div>

        <div class="loader-container" *ngIf="loader">
          <mat-spinner diameter="35" ></mat-spinner>
      </div>
