<div class="login-register">
    <div class="login-register-box">
      <mat-card appearance="outlined" class="card">
        <div class="logo">
          <img [src]="logo" >
          </div>
        <mat-card-content>
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="text-center">
              <h2 style="line-height: 0px;">Welcome Back!</h2>
              <h6 class="sign-in">Sign in to continue </h6>
            </div>
            <alert></alert>
  
            <div fxLayout="row wrap" >
              <!-- col full-->
              <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100" >
                <mat-form-field appearance="outline">
                  <mat-label class="custom-label">Email Address</mat-label>
                  <input matInput [placeholder]="'email'|label" formControlName="uname"
                    [formControl]="form.controls['uname']" />
                </mat-form-field>
                <small *ngIf="form.controls['uname'].hasError('email')" class="text-danger support-text"> {{'validEmailId'|label}} </small>
                <small *ngIf="form.controls['uname'].hasError('required') && form.controls['uname'].touched" class="text-danger support-text"> {{'emailIdRequired'|label}} </small>
              </div>
              <!-- col full-->
              <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100">
                <mat-form-field appearance="outline">
                  <mat-label class="custom-label">Password</mat-label>
                  <input matInput [type]="hide ? 'password' : 'text'" [placeholder]="'password'|label" formControlName="password"
                    [formControl]="form.controls['password']" />
                    <button mat-icon-button matSuffix (click)="hide = !hide" type="button">
                      <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                </mat-form-field>
                <small *ngIf="
                    form.controls['password'].hasError('required') &&
                    form.controls['password'].touched
                  " class="text-danger support-text"> {{'passwordRequired'|label}} </small>
              </div>

               <!-- col full-->
               <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100">
                <mat-form-field appearance="outline">
                  <mat-label class="custom-label">Business</mat-label>
                  <mat-select [(ngModel)]="selectedBusiness" (selectionChange)="changeBusiness(selectedBusiness)"
                  [formControl]="form.controls['business']">
                    <mat-option *ngFor="let biz of getBusiness" [value]="biz">
                      {{biz}}
                    </mat-option>
                    </mat-select>
                </mat-form-field>
                <small *ngIf="form.controls['business'].hasError('required') && form.controls['business'].touched" class="text-danger support-text"> {{'businessRequired'|label}} </small>
              </div>

               <!-- col full-->
               <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100" *ngIf="showCounterIdField">
                <mat-form-field appearance="outline">
                  <mat-label class="custom-label">Counter ID</mat-label>
                  <mat-select  
                  [formControl]="form.controls['counterId']">
                    <mat-option *ngFor="let list of getCounterIdList" [value]="list">
                      {{list}}
                    </mat-option>
                    </mat-select>
                </mat-form-field>
                <small *ngIf="form.controls['counterId'].hasError('required') && form.controls['counterId'].touched" class="text-danger support-text"> {{'counterIdRequired'|label}} </small>
              </div>
  
              <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100" class="text-right">
                <a class="alink" (click)="forgotPassword()" >Forgot Password?</a>
              </div>
        
              <!-- col full-->
              <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100">
                <button *ngIf="signIn" mat-raised-button color="primary" class="btn-block btn-lg m-t-20 m-b-20" type="submit"
                  [disabled]="!form.valid">
                 Sign In
                </button>
              </div>
              <mat-spinner style="margin:0 auto;" diameter="40" *ngIf="loader"></mat-spinner>
            </div>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
