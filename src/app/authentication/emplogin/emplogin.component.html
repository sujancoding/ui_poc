<div class="login-register" style="background-image: url(assets/images/background/empbg.jpeg)">
    <div class="login-register-box">
        <mat-card appearance="outlined">
            <mat-card-content>
                <form [formGroup]="form" (ngSubmit)="onSubmit()">
                    <div class="text-center">
                        <img alt="homepage" src="assets/images/logo.jpg" style="border-radius: 2px;
              padding: 5px;
              width: 120px;" />
                        <h4 class="m-t-0">Employee Login</h4>
                    </div>
                    <alert></alert>

                    <div fxLayout="row wrap">
                        <!-- col full-->
                        <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100">
                            <mat-form-field>
                                <input matInput placeholder="Email Id" formControlName="uname"
                                    [formControl]="form.controls['uname']" />
                            </mat-form-field>
                            <small *ngIf="
                    form.controls['uname'].hasError('required') && form.controls['uname'].touched
                  " class="text-danger support-text">Email id is required.</small>
                        </div>
                        <!-- col full-->
                        <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100">
                            <mat-form-field>
                                <input matInput type="password" placeholder="Password" formControlName="password"
                                    [formControl]="form.controls['password']" />
                            </mat-form-field>
                            <small *ngIf="
                    form.controls['password'].hasError('required') &&
                    form.controls['password'].touched
                  " class="text-danger support-text">Password is required.</small>
                        </div>
                        <!-- col half-->
                        <div fxFlex.gt-sm="50" fxFlex.gt-xs="50">
                            <mat-checkbox color="warn">Remember me</mat-checkbox>
                        </div>
                        <!-- col half-->
                        <div fxFlex.gt-sm="50" fxFlex.gt-xs="50" class="text-right">
                            <a [routerLink]="['/authentication/forgot']" class="link">Forgot pwd?</a>
                        </div>
                        <!-- col full-->
                        <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100">
                            <button mat-raised-button color="primary" class="btn-block btn-lg m-t-20 m-b-20"
                                type="submit" [disabled]="!form.valid">
                                Login
                            </button>
                        </div>
                    </div>
                </form>
            </mat-card-content>
        </mat-card>
    </div>
</div>
