<div fxLayout="row wrap">
    <div fxFlex.gt-sm="50%" fxFlex="100">

        <mat-card appearance="outlined">
            <mat-card-header class="bg-info text-white">
                <mat-card-title class="title-card-left">Latest Activity</mat-card-title>
                <mat-card-title class="title-card-right">See all</mat-card-title>
            </mat-card-header>

            <mat-card-content>
                <div class="table-responsive">
                    <table mat-table [dataSource]="dataSource" class="table employee-list no-wrap">
                        <ng-container matColumnDef="name">
                            <!-- <th mat-header-cell *matHeaderCellDef></th> -->
                            <td mat-cell *matCellDef="let element">
                                <div class="d-flex">
                                    <div>
                                        <p class="font-bold m-b-0 m-t-0">{{ element.Name }}</p>
                                        <small>{{ element.DateOfTxn }}</small>
                                    </div>
                                </div>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="amount">
                            <!-- <th mat-header-cell *matHeaderCellDef></th> -->
                            <td mat-cell *matCellDef="let element" style="color:red">{{ element.Amount }}</td>
                        </ng-container>



                        <!-- <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr> -->
                        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                    </table>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
